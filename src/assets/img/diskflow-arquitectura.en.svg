<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="DiskFlow three-layer architecture">
  <!-- Colores en hex: un SVG dentro de <img> no lee las variables CSS -->
  <defs>
    <style>
      .t   { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
      .ink { fill: #E8EDF7; }
      .dim { fill: #97A3BC; }
      .sig { fill: #4FD1E8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4FD1E8"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#97A3BC"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#0B1622"/>

  <!-- FRONTEND -->
  <rect x="60" y="40" width="1080" height="170" rx="20" fill="#121E2E" stroke="#E8EDF7" stroke-opacity="0.12"/>
  <text class="t dim" x="88" y="72" font-size="17" letter-spacing="1.5">FRONTEND · Vue 3 + TypeScript</text>

  <rect x="92" y="92" width="306" height="96" rx="12" fill="#0B1622" stroke="#E8EDF7" stroke-opacity="0.16"/>
  <text class="t ink" x="245" y="133" font-size="23" font-weight="600" text-anchor="middle">Treemap · table</text>
  <text class="t dim" x="245" y="162" font-size="17" text-anchor="middle">features/</text>

  <rect x="447" y="92" width="306" height="96" rx="12" fill="#0B1622" stroke="#4FD1E8" stroke-opacity="0.55"/>
  <text class="t sig" x="600" y="133" font-size="23" font-weight="600" text-anchor="middle">Backend</text>
  <text class="t dim" x="600" y="162" font-size="17" text-anchor="middle">interface</text>

  <rect x="802" y="92" width="306" height="96" rx="12" fill="#0B1622" stroke="#E8EDF7" stroke-opacity="0.16"/>
  <text class="t ink" x="955" y="133" font-size="23" font-weight="600" text-anchor="middle">wailsjs</text>
  <text class="t dim" x="955" y="162" font-size="17" text-anchor="middle">generated bindings</text>

  <line x1="404" y1="140" x2="441" y2="140" stroke="#97A3BC" stroke-width="1.5" marker-end="url(#arrowDim)"/>
  <line x1="759" y1="140" x2="796" y2="140" stroke="#97A3BC" stroke-width="1.5" marker-end="url(#arrowDim)"/>

  <!-- Frontend ↔ adapter -->
  <line x1="990" y1="196" x2="990" y2="282" stroke="#4FD1E8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="990" cy="196" r="4.5" fill="#4FD1E8"/>
  <text class="t dim" x="1006" y="246" font-size="17">commands</text>

  <line x1="920" y1="282" x2="920" y2="196" stroke="#97A3BC" stroke-width="1.5" marker-end="url(#arrowDim)"/>
  <circle cx="920" cy="282" r="4.5" fill="none" stroke="#97A3BC" stroke-width="1.5"/>
  <text class="t dim" x="904" y="246" font-size="17" text-anchor="end">events: scan:progress ≤ 10/s · scan:done</text>

  <!-- ADAPTER -->
  <rect x="60" y="290" width="1080" height="110" rx="20" fill="#121E2E" stroke="#E8EDF7" stroke-opacity="0.12"/>
  <text class="t dim" x="88" y="322" font-size="17" letter-spacing="1.5">ADAPTER · internal/desktop</text>
  <text class="t ink" x="88" y="364" font-size="19">StartScan · CancelScan · Children · paginated queries</text>

  <rect x="802" y="312" width="306" height="72" rx="12" fill="#0B1622" stroke="#4FD1E8" stroke-opacity="0.55"/>
  <text class="t sig" x="955" y="343" font-size="21" font-weight="600" text-anchor="middle">Wails v2</text>
  <text class="t dim" x="955" y="369" font-size="16" text-anchor="middle">the only package importing it</text>

  <!-- Adapter → engine -->
  <line x1="955" y1="392" x2="955" y2="462" stroke="#97A3BC" stroke-width="1.5" marker-end="url(#arrowDim)"/>
  <text class="t dim" x="971" y="434" font-size="17">direct Go calls</text>

  <!-- ENGINE -->
  <rect x="60" y="470" width="1080" height="150" rx="20" fill="#121E2E" stroke="#E8EDF7" stroke-opacity="0.12"/>
  <text class="t dim" x="88" y="502" font-size="17" letter-spacing="1.5">ENGINE · internal/engine · pure Go</text>

  <rect x="802" y="522" width="306" height="80" rx="12" fill="#0B1622" stroke="#E8EDF7" stroke-opacity="0.16"/>
  <text class="t ink" x="955" y="557" font-size="21" font-weight="600" text-anchor="middle">Scanner</text>
  <text class="t dim" x="955" y="584" font-size="16" text-anchor="middle">concurrent · cancellable</text>

  <rect x="447" y="522" width="306" height="80" rx="12" fill="#0B1622" stroke="#E8EDF7" stroke-opacity="0.16"/>
  <text class="t ink" x="600" y="557" font-size="21" font-weight="600" text-anchor="middle">Index</text>
  <text class="t dim" x="600" y="584" font-size="16" text-anchor="middle">batched transactions</text>

  <rect x="92" y="522" width="306" height="80" rx="12" fill="#0B1622" stroke="#E8EDF7" stroke-opacity="0.16"/>
  <text class="t ink" x="245" y="557" font-size="21" font-weight="600" text-anchor="middle">SQLite</text>
  <text class="t dim" x="245" y="584" font-size="16" text-anchor="middle">pure Go, no CGO · WAL</text>

  <line x1="796" y1="562" x2="759" y2="562" stroke="#97A3BC" stroke-width="1.5" marker-end="url(#arrowDim)"/>
  <line x1="441" y1="562" x2="404" y2="562" stroke="#97A3BC" stroke-width="1.5" marker-end="url(#arrowDim)"/>

  <text class="t dim" x="600" y="652" font-size="17" text-anchor="middle">The engine has no idea there is a UI, so it is tested and measured on its own.</text>
</svg>
