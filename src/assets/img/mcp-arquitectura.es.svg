<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Arquitectura del cliente y servidor MCP">
  <!-- Colores en hex literal: un SVG dentro de <img> no lee las variables CSS de la página -->
  <defs>
    <style>
      .t   { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
      .ink { fill: #F2EAE0; }
      .dim { fill: #A8988B; }
      .sig { fill: #E0A33A; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E0A33A"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A8988B"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#120E0C"/>

  <!-- ================= CLIENTE ================= -->
  <rect x="60" y="72" width="1080" height="186" rx="20" fill="#1A1411" stroke="#F2EAE0" stroke-opacity="0.12"/>
  <text class="t dim" x="88" y="106" font-size="17" letter-spacing="1.5">CLIENTE · TypeScript</text>

  <rect x="92" y="126" width="306" height="104" rx="12" fill="#120E0C" stroke="#F2EAE0" stroke-opacity="0.16"/>
  <text class="t ink" x="245" y="169" font-size="23" font-weight="600" text-anchor="middle">CLI · Web</text>
  <text class="t dim" x="245" y="198" font-size="17" text-anchor="middle">/tools · /servers · /log</text>

  <rect x="447" y="126" width="306" height="104" rx="12" fill="#120E0C" stroke="#F2EAE0" stroke-opacity="0.16"/>
  <text class="t ink" x="600" y="169" font-size="23" font-weight="600" text-anchor="middle">Host + LLM</text>
  <text class="t dim" x="600" y="198" font-size="17" text-anchor="middle">proveedor intercambiable</text>

  <rect x="802" y="126" width="306" height="104" rx="12" fill="#120E0C" stroke="#E0A33A" stroke-opacity="0.55"/>
  <text class="t sig" x="955" y="169" font-size="23" font-weight="600" text-anchor="middle">mcp-client</text>
  <text class="t dim" x="955" y="198" font-size="17" text-anchor="middle">handshake · ids · catálogo</text>

  <line x1="404" y1="178" x2="441" y2="178" stroke="#A8988B" stroke-width="1.5" marker-end="url(#arrowDim)"/>
  <line x1="759" y1="178" x2="796" y2="178" stroke="#A8988B" stroke-width="1.5" marker-end="url(#arrowDim)"/>

  <!-- ================= FRONTERA DEL PROTOCOLO ================= -->
  <line x1="60" y1="337" x2="1140" y2="337" stroke="#F2EAE0" stroke-opacity="0.12" stroke-dasharray="4 7"/>

  <text class="t sig" x="600" y="330" font-size="27" font-weight="600" text-anchor="middle">JSON-RPC 2.0</text>
  <text class="t dim" x="600" y="362" font-size="18" text-anchor="middle">stdio  ·  Streamable HTTP + bearer token</text>

  <!-- El canal conecta mcp-client con el dispatcher, que están alineados:
       la petición baja y el resultado sube por la misma frontera.
       Los nodos repiten el motivo de la traza del sitio. -->
  <line x1="930" y1="266" x2="930" y2="409" stroke="#E0A33A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="930" cy="266" r="4.5" fill="#E0A33A"/>
  <text class="t dim" x="914" y="303" font-size="17" text-anchor="end">tools/call</text>

  <line x1="1010" y1="409" x2="1010" y2="266" stroke="#A8988B" stroke-width="1.5" marker-end="url(#arrowDim)"/>
  <circle cx="1010" cy="409" r="4.5" fill="none" stroke="#A8988B" stroke-width="1.5"/>
  <text class="t dim" x="1026" y="303" font-size="17">resultado</text>

  <!-- ================= SERVIDOR ================= -->
  <rect x="60" y="417" width="1080" height="186" rx="20" fill="#1A1411" stroke="#F2EAE0" stroke-opacity="0.12"/>
  <text class="t dim" x="88" y="451" font-size="17" letter-spacing="1.5">SERVIDOR · Go</text>

  <!-- Fila en sentido inverso: el dispatcher queda bajo mcp-client, que es
       con quien realmente habla, y la cadena avanza hacia SQLite -->
  <rect x="887" y="471" width="226" height="104" rx="12" fill="#120E0C" stroke="#F2EAE0" stroke-opacity="0.16"/>
  <text class="t ink" x="1000" y="514" font-size="21" font-weight="600" text-anchor="middle">Dispatcher</text>
  <text class="t dim" x="1000" y="542" font-size="16" text-anchor="middle">‑32700 … ‑32603</text>

  <rect x="622" y="471" width="226" height="104" rx="12" fill="#120E0C" stroke="#E0A33A" stroke-opacity="0.55"/>
  <text class="t sig" x="735" y="514" font-size="21" font-weight="600" text-anchor="middle">Control de rol</text>
  <text class="t dim" x="735" y="542" font-size="16" text-anchor="middle">falla cerrado</text>

  <rect x="357" y="471" width="226" height="104" rx="12" fill="#120E0C" stroke="#F2EAE0" stroke-opacity="0.16"/>
  <text class="t ink" x="470" y="514" font-size="21" font-weight="600" text-anchor="middle">5 tools</text>
  <text class="t dim" x="470" y="542" font-size="16" text-anchor="middle">idempotentes</text>

  <rect x="92" y="471" width="226" height="104" rx="12" fill="#120E0C" stroke="#F2EAE0" stroke-opacity="0.16"/>
  <text class="t ink" x="205" y="514" font-size="21" font-weight="600" text-anchor="middle">SQLite</text>
  <text class="t dim" x="205" y="542" font-size="16" text-anchor="middle">Go puro, sin CGO</text>

  <line x1="881" y1="523" x2="854" y2="523" stroke="#A8988B" stroke-width="1.5" marker-end="url(#arrowDim)"/>
  <line x1="616" y1="523" x2="589" y2="523" stroke="#A8988B" stroke-width="1.5" marker-end="url(#arrowDim)"/>
  <line x1="351" y1="523" x2="324" y2="523" stroke="#A8988B" stroke-width="1.5" marker-end="url(#arrowDim)"/>

  <text class="t dim" x="600" y="645" font-size="17" text-anchor="middle">El modelo decide qué preguntar; el servidor decide qué se puede responder.</text>
</svg>
