<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Arquitectura de DiskFlow en tres capas">
  <!-- Colores en hex: un SVG dentro de <img> no lee las variables CSS -->
  <defs>
    <style>
      .t   { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
      .ink { fill: #F2EAE0; }
      .dim { fill: #A8988B; }
      .sig { fill: #E0A33A; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E0A33A"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A8988B"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#120E0C"/>

  <!-- FRONTEND -->
  <rect x="60" y="40" width="1080" height="170" rx="20" fill="#1A1411" stroke="#F2EAE0" stroke-opacity="0.12"/>
  <text class="t dim" x="88" y="72" font-size="17" letter-spacing="1.5">FRONTEND · Vue 3 + TypeScript</text>

  <rect x="92" y="92" width="306" height="96" rx="12" fill="#120E0C" stroke="#F2EAE0" stroke-opacity="0.16"/>
  <text class="t ink" x="245" y="133" font-size="23" font-weight="600" text-anchor="middle">Treemap · tabla</text>
  <text class="t dim" x="245" y="162" font-size="17" text-anchor="middle">features/</text>

  <rect x="447" y="92" width="306" height="96" rx="12" fill="#120E0C" stroke="#E0A33A" stroke-opacity="0.55"/>
  <text class="t sig" x="600" y="133" font-size="23" font-weight="600" text-anchor="middle">Backend</text>
  <text class="t dim" x="600" y="162" font-size="17" text-anchor="middle">interfaz</text>

  <rect x="802" y="92" width="306" height="96" rx="12" fill="#120E0C" stroke="#F2EAE0" stroke-opacity="0.16"/>
  <text class="t ink" x="955" y="133" font-size="23" font-weight="600" text-anchor="middle">wailsjs</text>
  <text class="t dim" x="955" y="162" font-size="17" text-anchor="middle">bindings generados</text>

  <line x1="404" y1="140" x2="441" y2="140" stroke="#A8988B" stroke-width="1.5" marker-end="url(#arrowDim)"/>
  <line x1="759" y1="140" x2="796" y2="140" stroke="#A8988B" stroke-width="1.5" marker-end="url(#arrowDim)"/>

  <!-- Frontend ↔ adaptador -->
  <line x1="990" y1="196" x2="990" y2="282" stroke="#E0A33A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="990" cy="196" r="4.5" fill="#E0A33A"/>
  <text class="t dim" x="1006" y="246" font-size="17">comandos</text>

  <line x1="920" y1="282" x2="920" y2="196" stroke="#A8988B" stroke-width="1.5" marker-end="url(#arrowDim)"/>
  <circle cx="920" cy="282" r="4.5" fill="none" stroke="#A8988B" stroke-width="1.5"/>
  <text class="t dim" x="904" y="246" font-size="17" text-anchor="end">eventos: scan:progress ≤ 10/s · scan:done</text>

  <!-- ADAPTADOR -->
  <rect x="60" y="290" width="1080" height="110" rx="20" fill="#1A1411" stroke="#F2EAE0" stroke-opacity="0.12"/>
  <text class="t dim" x="88" y="322" font-size="17" letter-spacing="1.5">ADAPTADOR · internal/desktop</text>
  <text class="t ink" x="88" y="364" font-size="19">StartScan · CancelScan · Children · consultas paginadas</text>

  <rect x="802" y="312" width="306" height="72" rx="12" fill="#120E0C" stroke="#E0A33A" stroke-opacity="0.55"/>
  <text class="t sig" x="955" y="343" font-size="21" font-weight="600" text-anchor="middle">Wails v2</text>
  <text class="t dim" x="955" y="369" font-size="16" text-anchor="middle">único paquete que lo importa</text>

  <!-- Adaptador → motor -->
  <line x1="955" y1="392" x2="955" y2="462" stroke="#A8988B" stroke-width="1.5" marker-end="url(#arrowDim)"/>
  <text class="t dim" x="971" y="434" font-size="17">llamadas Go directas</text>

  <!-- MOTOR -->
  <rect x="60" y="470" width="1080" height="150" rx="20" fill="#1A1411" stroke="#F2EAE0" stroke-opacity="0.12"/>
  <text class="t dim" x="88" y="502" font-size="17" letter-spacing="1.5">MOTOR · internal/engine · Go puro</text>

  <rect x="802" y="522" width="306" height="80" rx="12" fill="#120E0C" stroke="#F2EAE0" stroke-opacity="0.16"/>
  <text class="t ink" x="955" y="557" font-size="21" font-weight="600" text-anchor="middle">Escáner</text>
  <text class="t dim" x="955" y="584" font-size="16" text-anchor="middle">concurrente · cancelable</text>

  <rect x="447" y="522" width="306" height="80" rx="12" fill="#120E0C" stroke="#F2EAE0" stroke-opacity="0.16"/>
  <text class="t ink" x="600" y="557" font-size="21" font-weight="600" text-anchor="middle">Índice</text>
  <text class="t dim" x="600" y="584" font-size="16" text-anchor="middle">lotes en transacciones</text>

  <rect x="92" y="522" width="306" height="80" rx="12" fill="#120E0C" stroke="#F2EAE0" stroke-opacity="0.16"/>
  <text class="t ink" x="245" y="557" font-size="21" font-weight="600" text-anchor="middle">SQLite</text>
  <text class="t dim" x="245" y="584" font-size="16" text-anchor="middle">Go puro, sin CGO · WAL</text>

  <line x1="796" y1="562" x2="759" y2="562" stroke="#A8988B" stroke-width="1.5" marker-end="url(#arrowDim)"/>
  <line x1="441" y1="562" x2="404" y2="562" stroke="#A8988B" stroke-width="1.5" marker-end="url(#arrowDim)"/>

  <text class="t dim" x="600" y="652" font-size="17" text-anchor="middle">El motor no sabe que existe una interfaz: se prueba y se mide por separado.</text>
</svg>
